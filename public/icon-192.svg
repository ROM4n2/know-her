<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="inkGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1D17" />
      <stop offset="100%" stop-color="#15140F" />
    </linearGradient>
    <linearGradient id="roseGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="softGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Editorial Ink) -->
  <rect width="192" height="192" rx="42" fill="url(#inkGrad192)" />
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="#FAF8F5" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Botanical Leaf & Anchor Emblem -->
  <g transform="translate(96, 90) scale(4.6) translate(-12, -12)" filter="url(#softGlow192)">
    <!-- Leaf Curve -->
    <path
      d="M12 3c-4.5 4.5-6 9-3 12 3 3 7.5 1.5 12-3-4.5-4.5-6-9-9-9Z"
      fill="url(#roseGrad192)"
      fill-opacity="0.22"
      stroke="url(#roseGrad192)"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Stem / Vein -->
    <path
      d="M12 3v17"
      stroke="#FAF8F5"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Subtle Secondary Pulse -->
    <circle cx="12" cy="7" r="1.3" fill="#FDA4AF" />
  </g>

  <!-- Editorial Brand Typography Footnote -->
  <text
    x="96"
    y="166"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Charter', 'Source Serif Pro', serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.16em"
    fill="#FAF8F5"
    fill-opacity="0.75"
  >KNOW-HER</text>
</svg>
