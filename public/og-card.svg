<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="50%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Decorative Circles -->
  <circle cx="1080" cy="120" r="260" fill="#fecdd3" opacity="0.35" />
  <circle cx="120" cy="540" r="220" fill="#fed7aa" opacity="0.25" />
  <circle cx="960" cy="520" r="180" fill="#fbcfe8" opacity="0.3" />

  <!-- Main Card Container -->
  <g transform="translate(100, 85)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="240" height="42" rx="21" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5" />
    <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#be123c" text-anchor="middle">
      🌸 每日性科普与愉悦探索
    </text>

    <!-- Brand Name -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#roseGrad)" letter-spacing="-1.5">
      know-her
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#1f2937">
      打破两性信息差与羞耻感 · 科学知情分享
    </text>

    <!-- Value Proposition -->
    <text x="0" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#4b5563">
      避开伪科学与恐吓营销。每日精选权威医学文献导读，涵盖避孕、愉悦、月经与知情同意。
    </text>

    <!-- Four Pillars Badges -->
    <g transform="translate(0, 320)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="190" height="52" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="95" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#047857" text-anchor="middle">
        🛡️ 安全避孕指南
      </text>

      <!-- Badge 2 -->
      <rect x="210" y="0" width="190" height="52" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
      <text x="305" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#be123c" text-anchor="middle">
        🌸 愉悦探索解剖
      </text>

      <!-- Badge 3 -->
      <rect x="420" y="0" width="190" height="52" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="515" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#1d4ed8" text-anchor="middle">
        🩸 生理机制常识
      </text>

      <!-- Badge 4 -->
      <rect x="630" y="0" width="190" height="52" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
      <text x="725" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#7e22ce" text-anchor="middle">
        💬 知情同意沟通
      </text>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 420)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="18" font-weight="600" fill="#9ca3af">
        https://rom4n2.github.io/know-her/
      </text>
      <text x="1000" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#9ca3af" text-anchor="end">
        WHO / MSD Manual / UNESCO 权威引证 · 100% 真实链接
      </text>
    </g>
  </g>
</svg>
