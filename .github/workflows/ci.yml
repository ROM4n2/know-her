name: CI

# 门禁：始终运行，无路径过滤（ADR-0001 P1 折叠条款 / 架构子计划 Task 6）
# fork PR 零凭据原则：本文件不引用任何仓库 secret 值
#
# [S2 修复] push 触发器原带 `branches-ignore: [ master ]` ⇒ **合并到 master 也不跑门禁**；
# 而本仓库无 branch protection / ruleset（已实测 404 / []）⇒ 内容门禁在合并环节彻底失守。
# 故 master 的 push 同样纳入覆盖：内容门禁（pnpm test:graph，G1~G9）必须有一个强制执行点。
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (astro check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: astro check（阻断）
        run: pnpm check

      - name: Decision Tree & Glossary Consistency Check (图连通性与词典完整性)
        run: pnpm test:graph

      - name: Frontmatter & Links Check（零404外链阻断门禁）
        run: |
          pnpm curate:check
          pnpm curate:links

  build:
    name: pnpm build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: astro build（阻断）
        run: pnpm build
