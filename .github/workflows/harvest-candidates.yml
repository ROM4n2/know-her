name: Harvest Daily Candidates (Pipeline B)

# 每日自动化权威信源扫描与待审 Draft PR 提交 (ADR-0002 Pipeline B)
# 触发时间：每天北京时间 08:30 (UTC 00:30) 或由维护者手动派发
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "harvest-candidates"
  cancel-in-progress: false

jobs:
  harvest:
    name: 权威信源扫描与草稿 PR 生成
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 配置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 执行自动化扫描与待审 PR 发起
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/curate_harvester.py --limit 1 --create-pr

      - name: 写入工作流执行摘要
        if: always()
        run: |
          echo "### 🌸 Pipeline B 每日自动化候选扫描已完成" >> $GITHUB_STEP_SUMMARY
          echo "- **执行时间**：$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **审阅指引**：若有新候选抓取成功，可在 [Pull Requests](https://github.com/${{ github.repository }}/pulls?q=is%3Apr+label%3Adaily-candidate) 查看并一键合并上线。" >> $GITHUB_STEP_SUMMARY
