name: Daily Health Check & Curate Routine

# 每日晨间自动化巡检与精选播报 (ADR-0002)
# 触发时间：每天北京时间 08:00 (UTC 00:00) 或手动派发
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  daily-routine:
    name: Daily Routine & Link Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontmatter Check
        run: pnpm curate:check

      - name: Zero-404 Live Links Probe (今日精选外链轻量探测)
        id: link_check
        run: python scripts/curate.py check-links --today-only

      - name: Today's Featured Pick & Report (今日精选播报)
        run: |
          echo "### 🌸 know-her 每日科普健康报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pnpm curate:today >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **今日主推外链健康探测通过，零 404 死链。**" >> $GITHUB_STEP_SUMMARY

      - name: Alert on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 [每日巡检告警] 发现失效外链或格式异常',
              body: `每日晨间定时巡检在运行中发现异常，请检查构建日志并排查是否有第三方原出处页面变动。\n\n运行记录: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            })
