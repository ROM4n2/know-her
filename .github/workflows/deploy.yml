name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify article sources (零404外链巡检门禁)
        run: |
          pnpm curate:check
          pnpm curate:links

      # [S2 修复] 内容门禁（G1~G9：文章↔速测题 1:1、决策树图连通性、词典完整性、草稿模板 MDX 编译…）
      # 原先 deploy 在 build 前**只**跑 curate:check / curate:links / pnpm build，**不含** pnpm test:graph
      # ⇒ 合并到 master 不跑门禁（ci.yml 曾排除 master）、合并后部署也不跑 ⇒ 内容门禁零执行点。
      # 此步**阻断式**执行（非 continue-on-error）：内容门禁失败 ⇒ 不产出 dist ⇒ 不部署。
      - name: Content Gate (图连通性 / 词典完整性 / 文章↔速测题 1:1，阻断)
        run: pnpm test:graph

      - name: Astro build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
